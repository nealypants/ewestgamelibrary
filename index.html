<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night Librarian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cabinet:#141216; --panel:#1E1A20; --panel-hover:#232028; --brick:#A64B33;

    --line:#332C36; --team:#6E8CA8; --solo:#8A6FA8; --body:#CFC5B4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cabinet); color:var(--bone); font-family:'Inter',system-ui,sans-serif; min-height:100vh;}
  header{background:linear-gradient(180deg,var(--brick) 0%,#8C3E2B 100%); border-bottom:4px solid var(--wood); padding:24px 20px;}
  header .eyebrow{color:#F3D9C4; letter-spacing:.25em; font-size:11px; text-transform:uppercase; margin-bottom:4px;}
  header h1{font-family:'IM Fell English',serif; font-size:clamp(28px,6vw,44px); line-height:1.05; color:#FBF3E4; font-weight:400;}
  main{max-width:760px; margin:0 auto; padding:20px 16px 40px;}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--bone); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; outline:none;}
  input::placeholder{color:#7a7166;}
  input:focus,select:focus,textarea:focus{border-color:var(--wood);}
  .search{width:100%; padding:12px 16px;}
  .seats-row{display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap;}
  .seats-label{font-family:'IM Fell English',serif; font-size:18px; color:var(--wood);}
  .seat-btn{width:36px; height:36px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--bone); font-size:18px; cursor:pointer;}
  .seat-btn:hover{background:var(--panel-hover);}
  .seat-val{min-width:44px; text-align:center; font-size:14px; font-weight:500;}
  .link-btn{background:none; border:none; color:var(--brick); font-size:12px; text-decoration:underline; cursor:pointer;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{padding:5px 12px; border-radius:999px; font-size:12px; cursor:pointer; background:transparent; color:var(--dim); border:1px solid var(--line);}
  .chip.tag{border-style:dashed;}
  .chip.active{color:#15130F; font-weight:500;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:18px 0 8px; flex-wrap:wrap;}
  .count{color:var(--dim); font-size:12px;}
  .toolbar-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .action-btn{font-size:12px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--bone); cursor:pointer;}
  .action-btn:hover{background:var(--panel-hover);}
  .action-btn.primary{background:var(--wood); color:#241C10; border-color:var(--wood); font-weight:600;}
  .list{border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .row{background:var(--panel); padding:12px 16px; border-left:3px solid var(--dim); position:relative;}
  .row + .row{border-top:1px solid var(--line);}
  .row:hover{background:var(--panel-hover);}
  .row-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .row h2{font-family:'IM Fell English',serif; font-size:18px; color:var(--bone); font-weight:400;}
  .players{color:var(--wood); font-size:12px; white-space:nowrap;}
  .meta{display:flex; flex-wrap:wrap; gap:2px 12px; margin-top:2px; font-size:12px; color:var(--dim);}
  .meta .mode{font-weight:500;}
  .meta .flag{color:var(--gold);}
  .sum{font-size:14px; margin-top:6px; color:var(--body); line-height:1.45;}
  .row-tools{display:flex; gap:10px; margin-top:8px;}
  .row-tools button{background:none; border:none; font-size:11px; color:#7a7166; cursor:pointer; padding:0;}
  .row-tools button:hover{color:var(--wood);}
  .row-tools button.danger:hover{color:var(--brick);}
  .empty{padding:24px; font-size:14px; color:var(--dim);}
  .notes-toggle{margin-top:24px; background:none; border:none; color:var(--brick); font-family:'IM Fell English',serif; font-size:17px; cursor:pointer;}
  .notes{margin-top:8px; padding-left:4px; list-style:none;}
  .notes li{font-size:14px; color:var(--dim); display:flex; gap:8px; margin-bottom:6px;}
  .notes li::before{content:"✦"; color:var(--brick);}
  .footer-note{color:#6E655A; font-size:12px; margin-top:32px;}
  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(10,8,12,.75); display:none; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:10;}
  .overlay.open{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:520px; padding:22px;}
  .modal h3{font-family:'IM Fell English',serif; font-weight:400; font-size:22px; color:var(--wood); margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;}
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .check-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:13px; color:var(--dim);}
  .check-row input{width:auto;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--wood); color:#241C10; font-size:13px; font-weight:500; padding:10px 18px; border-radius:999px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20;}
  .toast.show{opacity:1;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<header>
  <p class="eyebrow">The cabinet · <span id="totalCount"></span> titles shelved</p>
  <h1>Game Night Librarian</h1>
</header>

<main>
  <input id="search" class="search" type="text" placeholder="Search titles, themes, mechanics… try “traitor” or “escape room”">

  <div class="seats-row">
    <span class="seats-label">Seats at the table</span>
    <button class="seat-btn" id="seatMinus" aria-label="Fewer players">−</button>
    <span class="seat-val" id="seatVal">any</span>
    <button class="seat-btn" id="seatPlus" aria-label="More players">+</button>
    <button class="link-btn" id="seatClear" style="display:none">clear</button>
  </div>

  <div class="chips" id="modeChips"></div>
  <div class="chips" id="tagChips"></div>

  <div class="toolbar">
    <span class="count" id="resultCount"></span>
    <div class="toolbar-actions">
      <button class="action-btn primary" id="addBtn">+ Add game</button>
      <button class="action-btn" id="syncBtn" style="display:none">Load shared</button>
      <button class="action-btn" id="exportBtn">Export</button>
      <button class="action-btn" id="importBtn">Import</button>
      <button class="action-btn" id="resetBtn">Reset</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <div class="list" id="list"></div>

  <button class="notes-toggle" id="notesToggle">▸ Shelf notes &amp; wishlist</button>
  <ul class="notes" id="notes" style="display:none"></ul>

  <p class="footer-note">Edits save automatically in this browser. To share edits with everyone: Export, rename the file to games.json, and upload it to the GitHub repo — then others tap “Load shared.”</p>
</main>

<div class="overlay" id="overlay">
  <form class="modal" id="editForm">
    <h3 id="modalTitle">Add a game</h3>
    <div class="field"><label for="f_t">Title</label><input id="f_t" required></div>
    <div class="field-row">
      <div class="field"><label for="f_theme">Theme</label><input id="f_theme"></div>
      <div class="field"><label for="f_type">Type of game</label><input id="f_type"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="f_min">Min players</label><input id="f_min" type="number" min="1" max="99" required></div>
      <div class="field"><label for="f_max">Max players</label><input id="f_max" type="number" min="1" max="99" required></div>
      <div class="field"><label for="f_mode">Mode</label>
        <select id="f_mode">
          <option>Co-op</option><option>Semi-co-op</option><option>Competitive</option>
          <option>Team</option><option>Solo</option><option>Varies</option>
        </select>
      </div>
    </div>
    <div class="field"><label for="f_tags">Tags (comma-separated)</label><input id="f_tags" placeholder="Horror, Party, Word…"></div>
    <div class="field"><label for="f_sum">Summary</label><textarea id="f_sum"></textarea></div>
    <div class="check-row"><input type="checkbox" id="f_v"><label for="f_v" style="display:inline">Flag as “double-check details”</label></div>
    <div class="modal-actions">
      <button type="button" class="action-btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="action-btn primary">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

const NOTES = [
  "Joking Hazard — you own an expansion pack but not the base game yet (wishlist item!)",
];

const MODES = ["Co-op","Semi-co-op","Competitive","Team","Solo","Varies"];
const MODE_COLORS = {"Co-op":"var(--moss)","Semi-co-op":"var(--gold)","Competitive":"var(--brick)","Team":"var(--team)","Solo":"var(--solo)","Varies":"var(--dim)"};
const STORE_KEY = "gameNightLibrary.v1";

// ---- state ----
let SHARED = null;          // library fetched from games.json (when hosted)
let hadLocalEdits = false;  // whether this browser already had a saved copy
let games = loadGames();
let q = "", seats = 0, mode = null, tag = null, editIndex = null;

function loadGames(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed) && parsed.length){ hadLocalEdits = true; return parsed; } }
  }catch(e){ /* storage unavailable (private mode, previews) — run in-memory */ }
  return JSON.parse(JSON.stringify(DEFAULT_GAMES));
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(games)); }catch(e){ /* in-memory only */ }
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

// ---- filtering ----
function allTags(){
  const set = new Set();
  games.forEach(g => (g.tags||[]).forEach(x => set.add(x)));
  return [...set].sort();
}
function filtered(){
  const needle = q.trim().toLowerCase();
  return games
    .map((g,i)=>({g,i}))
    .filter(({g})=>{
      if(seats>0 && !(g.min<=seats && seats<=g.max)) return false;
      if(mode && g.mode!==mode) return false;
      if(tag && !(g.tags||[]).includes(tag)) return false;
      if(needle){
        const hay = (g.t+" "+(g.theme||"")+" "+(g.type||"")+" "+(g.sum||"")+" "+(g.tags||[]).join(" ")).toLowerCase();
        if(!hay.includes(needle)) return false;
      }
      return true;
    })
    .sort((a,b)=>a.g.t.localeCompare(b.g.t));
}

// ---- rendering ----
function render(){
  document.getElementById("totalCount").textContent = games.length;

  const mc = document.getElementById("modeChips");
  mc.innerHTML = MODES.map(m=>{
    const active = mode===m;
    const style = active ? `background:${MODE_COLORS[m]};border-color:${MODE_COLORS[m]};` : "";
    return `<button class="chip ${active?"active":""}" style="${style}" data-mode="${m}">${m}</button>`;
  }).join("");

  const tc = document.getElementById("tagChips");
  tc.innerHTML = allTags().map(x=>{
    const active = tag===x;
    const style = active ? "background:var(--wood);border-color:var(--wood);" : "";
    return `<button class="chip tag ${active?"active":""}" style="${style}" data-tag="${x}">${x}</button>`;
  }).join("");

  const results = filtered();
  document.getElementById("resultCount").textContent = `${results.length} of ${games.length} games on the shelf`;

  const list = document.getElementById("list");
  if(!results.length){
    list.innerHTML = `<div class="empty">Nothing fits those filters. Loosen one — the shelf is deep.</div>`;
  }else{
    list.innerHTML = results.map(({g,i})=>`
      <div class="row" style="border-left-color:${MODE_COLORS[g.mode]||"var(--dim)"}">
        <div class="row-head">
          <h2>${esc(g.t)}</h2>
          <span class="players">${g.min===g.max ? g.min+"p" : g.min+"–"+g.max+"p"}</span>
        </div>
        <div class="meta">
          <span class="mode" style="color:${MODE_COLORS[g.mode]||"var(--dim)"}">${esc(g.mode)}</span>
          <span>${esc(g.theme||"")}</span><span>·</span><span>${esc(g.type||"")}</span>
          ${g.v ? '<span class="flag">⚑ double-check details</span>' : ""}
        </div>
        <p class="sum">${esc(g.sum||"")}</p>
        <div class="row-tools">
          <button data-edit="${i}">Edit</button>
          <button data-del="${i}" class="danger">Delete</button>
        </div>
      </div>`).join("");
  }

  document.getElementById("seatVal").textContent = seats===0 ? "any" : seats;
  document.getElementById("seatVal").style.color = seats ? "var(--bone)" : "var(--dim)";
  document.getElementById("seatClear").style.display = seats>0 ? "" : "none";
}

// ---- events ----
document.getElementById("search").addEventListener("input", e=>{ q=e.target.value; render(); });
document.getElementById("seatMinus").addEventListener("click", ()=>{ seats=Math.max(0,seats-1); render(); });
document.getElementById("seatPlus").addEventListener("click", ()=>{ seats=Math.min(21, seats===0?2:seats+1); render(); });
document.getElementById("seatClear").addEventListener("click", ()=>{ seats=0; render(); });

document.getElementById("modeChips").addEventListener("click", e=>{
  const m = e.target.dataset.mode; if(!m) return;
  mode = (mode===m) ? null : m; render();
});
document.getElementById("tagChips").addEventListener("click", e=>{
  const x = e.target.dataset.tag; if(!x) return;
  tag = (tag===x) ? null : x; render();
});

document.getElementById("list").addEventListener("click", e=>{
  const ei = e.target.dataset.edit, di = e.target.dataset.del;
  if(ei!==undefined) openModal(Number(ei));
  if(di!==undefined){
    const g = games[Number(di)];
    if(confirm(`Remove “${g.t}” from the shelf?`)){
      games.splice(Number(di),1); save(); render(); toast("Removed from the shelf");
    }
  }
});

document.getElementById("notesToggle").addEventListener("click", ()=>{
  const n = document.getElementById("notes");
  const open = n.style.display !== "none";
  n.style.display = open ? "none" : "";
  document.getElementById("notesToggle").textContent = (open ? "▸" : "▾") + " Shelf notes & wishlist";
});
document.getElementById("notes").innerHTML = NOTES.map(n=>`<li>${esc(n)}</li>`).join("");

// ---- modal ----
const overlay = document.getElementById("overlay");
function openModal(index){
  editIndex = index;
  const g = index===null ? {t:"",theme:"",type:"",min:2,max:4,mode:"Competitive",tags:[],sum:"",v:false} : games[index];
  document.getElementById("modalTitle").textContent = index===null ? "Add a game" : "Edit game";
  document.getElementById("f_t").value = g.t;
  document.getElementById("f_theme").value = g.theme||"";
  document.getElementById("f_type").value = g.type||"";
  document.getElementById("f_min").value = g.min;
  document.getElementById("f_max").value = g.max;
  document.getElementById("f_mode").value = g.mode||"Competitive";
  document.getElementById("f_tags").value = (g.tags||[]).join(", ");
  document.getElementById("f_sum").value = g.sum||"";
  document.getElementById("f_v").checked = !!g.v;
  overlay.classList.add("open");
  document.getElementById("f_t").focus();
}
function closeModal(){ overlay.classList.remove("open"); editIndex=null; }
document.getElementById("addBtn").addEventListener("click", ()=>openModal(null));
document.getElementById("cancelBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

document.getElementById("editForm").addEventListener("submit", e=>{
  e.preventDefault();
  let min = parseInt(document.getElementById("f_min").value,10) || 1;
  let max = parseInt(document.getElementById("f_max").value,10) || min;
  if(max < min) [min,max] = [max,min];
  const g = {
    t: document.getElementById("f_t").value.trim(),
    theme: document.getElementById("f_theme").value.trim(),
    type: document.getElementById("f_type").value.trim(),
    min, max,
    mode: document.getElementById("f_mode").value,
    tags: document.getElementById("f_tags").value.split(",").map(s=>s.trim()).filter(Boolean),
    sum: document.getElementById("f_sum").value.trim(),
  };
  if(document.getElementById("f_v").checked) g.v = true;
  if(!g.t){ return; }
  if(editIndex===null){ games.push(g); toast("Added to the shelf"); }
  else{ games[editIndex] = g; toast("Saved"); }
  save(); closeModal(); render();
});

// ---- export / import / reset ----
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(games,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "game-night-library.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed)) throw new Error("not an array");
      games = parsed; save(); render(); toast("Library imported");
    }catch(err){ alert("That file doesn't look like a library export. Import the JSON file created by the Export button."); }
  };
  reader.readAsText(file);
  e.target.value = "";
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  const label = SHARED ? "Restore the shared shelf from games.json?" : "Restore the original cataloged library?";
  if(confirm(label + " Your edits in this browser will be replaced.")){
    games = JSON.parse(JSON.stringify(SHARED || DEFAULT_GAMES));
    save(); render(); toast("Library restored");
  }
});

// ---- shared shelf (games.json alongside this file, e.g. on GitHub Pages) ----
async function fetchShared(){
  try{
    const res = await fetch("games.json", {cache:"no-store"});
    if(!res.ok) return null;
    const data = await res.json();
    if(Array.isArray(data) && data.length) return data;
  }catch(e){ /* not hosted, or no games.json — that's fine */ }
  return null;
}
document.getElementById("syncBtn").addEventListener("click", async ()=>{
  const fresh = await fetchShared();
  if(!fresh){ alert("Couldn't reach games.json — check your connection."); return; }
  SHARED = fresh;
  if(confirm("Replace your view with the latest shared shelf? Unpublished local edits will be lost (Export first to keep them).")){
    games = JSON.parse(JSON.stringify(SHARED));
    save(); render(); toast("Loaded the shared shelf");
  }
});
(async ()=>{
  SHARED = await fetchShared();
  if(SHARED){
    document.getElementById("syncBtn").style.display = "";
    if(!hadLocalEdits){ games = JSON.parse(JSON.stringify(SHARED)); save(); render(); }
  }
})();

render();
</script>
